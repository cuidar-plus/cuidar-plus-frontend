<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Cuidar+ | Sistema de Gestão Home Care</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sistema completo para gestão de empresas de Home Care - pacientes, profissionais, insumos e relatórios"
    />
    <meta
      name="keywords"
      content="home care, saúde, pacientes, gestão médica, cuidados domiciliares"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.gstatic.com" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- Theme color -->
    <meta name="theme-color" content="#4A90E2" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <app-root>
      <div class="loading-container">
        <div class="loading-spinner">
          <div class="spinner"></div>
          <p>Carregando Cuidar+...</p>
        </div>
      </div>
    </app-root>

    <style>
      .loading-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
        color: white;
        font-family: 'Inter', sans-serif;
      }

      .loading-spinner {
        text-align: center;
      }

      .spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto 20px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </body>
</html>
